function nowT(sec){const n=new Date(),z=x=>String(x).padStart(2,'0');return z(n.getHours())+':'+z(n.getMinutes())+(sec?':'+z(n.getSeconds()):'')}

function cloudErr(e){cs='err';if(!cloudErr.t||Date.now()-cloudErr.t>30000){cloudErr.t=Date.now();toast('Baza xatosi: '+(e&&e.message||e))}cstat()}
function mk(k){if(!CLOUD)return;dirty.add(k);S.dirty=[...dirty];save();clearTimeout(mk._t);mk._t=setTimeout(()=>flush().catch(cloudErr),400)}
async function flush(){if(!CLOUD||!tokA||syncing||!dirty.size)return true;syncing=true;let ok=true;
try{for(const k of [...dirty]){try{const v=CL.get(k);
if(v==null)await sb('kv?site=eq.'+SITE+'&k=eq.'+encodeURIComponent(k),{method:'DELETE'});
else await sb('kv?on_conflict=site,k',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({site:SITE,k,v,updated_at:new Date().toISOString()})});
dirty.delete(k)}catch(e){ok=false;cloudErr(e);break}}}finally{syncing=false;S.dirty=[...dirty];save()}
if(ok){cs='ok'}cstat();return ok}
async function cloudBoot(){if(!CLOUD||!tokA)return;cs='sync';cstat();try{
const mf='mig_'+SITE;if(!localStorage.getItem(mf)){CL.all().forEach(k=>dirty.add(k));S.dirty=[...dirty];save();localStorage.setItem(mf,'1')}
if(!(await flush())||dirty.size)throw new Error('Ma’lumot bazaga yozilmadi');await CL.pull();cs='ok';save();render()}catch(e){cloudErr(e)}cstat()}
function chDate(v){date=v;render();if(CLOUD&&tokA)CL.pull().then(c=>c&&render()).catch(cloudErr)}
setInterval(async()=>{if(!CLOUD||!auth||!tokA||document.hidden||syncing)return;try{if(dirty.size)await flush();if(!dirty.size&&await CL.pull()&&!document.querySelector('.modal'))render();cs='ok'}catch(e){cloudErr(e)}cstat()},15000);
const CL={sig:'',st:'',rd:{},
all(){const a=['settings'];S.teachers.forEach(t=>a.push('t:'+t.id));for(const d in S.rec)for(const id in S.rec[d])a.push('r:'+d+':'+id);return a},
get(k){if(k==='settings')return{cfg:S.cfg,tg:S.tg};const p=k.split(':');if(p[0]==='t')return S.teachers.find(t=>t.id===p[1])||null;const r=(S.rec[p[1]]||{})[p[2]];return r&&Object.keys(r).length?r:null},
async pull(){let ch=false;
const sig=((await sb('kv?site=eq.'+SITE+'&k=like.t:*&select=k,updated_at&order=k'))||[]).map(x=>x.k+x.updated_at).join('|');
if(sig!==CL.sig){const rows=await sbGet('t:*');S.teachers=rows.map(x=>Object.assign({ds:[]},x.v));CL.sig=sig;ch=true}
const s=await sb('kv?site=eq.'+SITE+'&k=eq.settings&select=v');
if(s&&s[0]){const j=JSON.stringify(s[0].v);if(j!==CL.st){S.cfg=Object.assign({inT:'08:45',outT:'15:00'},s[0].v.cfg||{});S.tg=Object.assign({tok:'',chat:'@maktab10id'},s[0].v.tg||{});CL.st=j;ch=true}}else mk('settings');
const rr=await sbGet('r:'+date+':*'),o={};rr.forEach(x=>{o[x.k.split(':')[2]]=x.v});const j2=JSON.stringify(o);
if(j2!==CL.rd[date]){S.rec[date]=o;CL.rd[date]=j2;ch=true}
if(ch)save();return ch}};
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+html+'</div>';document.body.appendChild(m);return m}
function limg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
function url(i,max,q){const w=i.naturalWidth||i.videoWidth||i.width,hh=i.naturalHeight||i.videoHeight||i.height,s=Math.min(1,max/Math.max(w,hh)),c=document.createElement('canvas');c.width=w*s;c.height=hh*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
const DO=()=>new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.4});
async function desc(img){const r=await faceapi.detectSingleFace(img,DO()).withFaceLandmarks(true).withFaceDescriptor();return r?Array.from(r.descriptor):null}
function loadM(){if(fs==='ok')return Promise.resolve(true);if(mp)return mp;fs='load';updChip();
mp=(async()=>{try{if(!window.faceapi)throw 0;try{await faceapi.tf.setBackend('webgl')}catch(e){}await faceapi.tf.ready();
for(const u of MUS){try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(u),faceapi.nets.faceLandmark68TinyNet.loadFromUri(u),faceapi.nets.faceRecognitionNet.loadFromUri(u)]);fs='ok';updChip();return true}catch(e){}}throw 0}catch(e){fs='fail';mp=null;updChip();return false}})();return mp}
/* ---- Telegram ---- */
async function tgSend(txt,html,quiet){const g=S.tg;if(!g.tok||!g.chat){if(!quiet)toast('Telegram sozlanmagan (⚙ tugmasi)');return false}
try{const b={chat_id:g.chat,text:txt};if(html)b.parse_mode='HTML';const r=await fetch('https://api.telegram.org/bot'+g.tok+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!j.ok)throw new Error(j.description);return true}catch(e){toast('Telegramga yuborilmadi: '+(e.message||'xato'));return false}}
function ntf(id,d,kind){const t=S.teachers.find(z=>z.id===id);if(!t)return;const x=calc(id,d),r=x.r;let s='👨‍🏫 '+t.f+' '+t.n+'\n';
if(kind==='in')s+='🕗 Kelgan payt: '+r.in+'\n📌 Holat: '+x.a.t;
else if(kind==='out')s+='🚪 Ketgan payt: '+r.out+'\n📌 Holat: '+(x.o?x.o.t:'');
else{s='✏️ Qo‘lda o‘zgartirildi\n'+s+'🕗 Kelgan: '+(r.in||'—')+'\n🚪 Ketgan: '+(r.out||'—')+'\n📌 Holat: '+x.a.t+(x.o&&x.o.k==='early'?' · Erta ketdi':'')+(r.note?'\n📝 '+r.note:'')}
tgSend(s+'\n📅 '+d,false,true)}
const he=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function sendRep(){const T=S.teachers,d=date;if(!T.length)return toast('Ustoz yo‘q');if(!S.tg.tok)return toast('Avval Telegramni sozlang (⚙)');
const c={ok:0,late:0,no:0,sab:0,early:0},em={ok:'✅',late:'⏰',no:'❌',sab:'📄'},rows=[];
T.forEach((t,i)=>{const x=calc(t.id,d);c[x.a.k]++;const er=x.o&&x.o.k==='early';if(er)c.early++;rows.push((i+1)+'. '+em[x.a.k]+' '+t.f+' '+t.n+' | '+(x.r.in||'—')+' | '+(x.r.out||'—')+' | '+x.a.t+(er?', erta ketdi':'')+(x.r.note?' ('+x.r.note+')':''))});
let ok=await tgSend('📋 <b>USTOZLAR DAVOMATI</b> · '+d+'\nKelish: '+S.cfg.inT+' gacha · Ketish: '+S.cfg.outT+' dan keyin\n\nJami: <b>'+T.length+'</b>\n✅ Vaqtida: '+c.ok+'\n⏰ Kech qoldi: '+c.late+'\n❌ Kelmadi: '+c.no+'\n📄 Sababli: '+c.sab+'\n🚪 Erta ketdi: '+c.early+'\n\n<i>Ustoz | Keldi | Ketdi | Holat</i>',true);
let buf='';const parts=[];rows.forEach(r=>{if((buf+r).length>3400){parts.push(buf);buf=''}buf+=r+'\n'});if(buf)parts.push(buf);
for(const p of parts){if(!ok)break;ok=await tgSend('<pre>'+he(p)+'</pre>',true)}
if(ok)toast('Hisobot Telegramga yuborildi')}
function cfg(){const m=modal(`<h3 style="margin-top:0">Sozlamalar</h3><label class="lb">Telegram bot tokeni</label><div class="inp" style="margin-top:0">${I('lock',18)}<input id="tk" placeholder="123456:AA..." value="${esc(S.tg.tok)}" autocomplete="off"></div><label class="lb">Kanal</label><div class="inp" style="margin-top:0">${I('send',18)}<input id="ch" placeholder="@kanal_nomi" value="${esc(S.tg.chat)}"></div>
<div class="row"><div style="flex:1"><label class="lb">Kelish vaqti (shundan keyin — kech)</label><input id="i1" type="time" value="${S.cfg.inT}"></div><div style="flex:1"><label class="lb">Ketish vaqti (shundan oldin — erta)</label><input id="o1" type="time" value="${S.cfg.outT}"></div></div>
<div class="row" style="margin-top:14px"><button class="btn g" id="x">Yopish</button><button class="btn g" id="ts">Test</button><button class="btn" id="sv">Saqlash</button></div>`);
const q=s=>m.querySelector(s),rd=()=>{S.tg={tok:q('#tk').value.trim(),chat:q('#ch').value.trim()};S.cfg={inT:q('#i1').value||'08:45',outT:q('#o1').value||'15:00'};save();mk('settings')};
q('#x').onclick=()=>m.remove();q('#sv').onclick=()=>{rd();m.remove();render()};q('#ts').onclick=async()=>{rd();if(await tgSend('✅ Ustozlar davomati: ulanish muvaffaqiyatli'))toast('Test xabar yuborildi')}}
/* ---- Qo'lda tahrirlash ---- */
function edit(id){const t=S.teachers.find(z=>z.id===id),r=((S.rec[date]||{})[id])||{};
const m=modal(`<h3 style="margin-top:0">${esc(t.f)} ${esc(t.n)} · ${date}</h3><div class="row"><div style="flex:1"><label class="lb">Kelgan vaqt</label><input id="a" type="time" value="${r.in||''}"></div><div style="flex:1"><label class="lb">Ketgan vaqt</label><input id="b" type="time" value="${r.out||''}"></div></div>
<label class="lb" style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tx)"><input id="s" type="checkbox" style="width:20px;height:20px" ${r.sab?'checked':''}> Sababli (ishi chiqib qolgan)</label><label class="lb">Izoh</label><input id="n" placeholder="Masalan: tuman hokimiyatiga chaqirilgan" value="${esc(r.note||'')}">
<div class="row" style="margin-top:14px"><button class="btn g" id="x">Bekor</button><button class="btn r" style="flex:1" id="cl">Tozalash</button><button class="btn" id="sv">Saqlash</button></div>`);
const q=s=>m.querySelector(s);q('#x').onclick=()=>m.remove();
q('#cl').onclick=()=>{if(S.rec[date])delete S.rec[date][id];save();mk('r:'+date+':'+id);m.remove();render()};
q('#sv').onclick=()=>{const x=R(date,id);x.in=q('#a').value||undefined;x.out=q('#b').value||undefined;x.sab=q('#s').checked||undefined;x.note=q('#n').value.trim()||undefined;
for(const k of ['in','out','sab','note'])if(x[k]===undefined)delete x[k];save();mk('r:'+date+':'+id);m.remove();render();ntf(id,date,'edit')}}
/* ---- Ustoz qo'shish ---- */
function addT(){let ph=[],cs=null;const m=modal(`<h3 style="margin-top:0">Yangi ustoz</h3><div class="inp">${I('user',18)}<input id="nf" placeholder="Ism"></div><div class="inp">${I('user',18)}<input id="nn" placeholder="Familya"></div>
<div class="row"><label class="btn g" style="flex:1">${I('up')} Rasm yuklash<input id="np" type="file" accept="image/*" multiple hidden></label><button class="btn g" style="flex:1" id="cm">${I('cam')} Kameradan</button></div>
<div id="cb" hidden style="margin-top:10px"><div class="vb"><video id="cv" playsinline muted autoplay></video></div><button class="btn w" id="sn" style="margin-top:8px">${I('cam')} Suratga olish</button></div>
<div class="ph" id="ph"></div><p class="mut">Aniqlik uchun 2–3 ta rasm qo‘shing: yorug‘, to‘g‘ri qaragan, yuz yopilmagan.</p>
<div class="row"><button class="btn g" id="x">Bekor</button><button class="btn" id="ok">Saqlash</button></div>`);
const q=s=>m.querySelector(s),stop=()=>{cs&&cs.getTracks().forEach(t=>t.stop());cs=null};const rp=()=>q('#ph').innerHTML=ph.map(p=>`<img src="${p}">`).join('');
q('#x').onclick=()=>{stop();m.remove()};
q('#np').onchange=async e=>{for(const f of e.target.files){const i=await limg(URL.createObjectURL(f));ph.push(url(i,640,.85))}rp()};
q('#cm').onclick=async()=>{try{cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});q('#cv').srcObject=cs;q('#cb').hidden=false}catch(e){toast('Kameraga ruxsat berilmadi')}};
q('#sn').onclick=()=>{const v=q('#cv');if(!v.videoWidth)return;ph.push(url(v,640,.85));rp()};
q('#ok').onclick=async()=>{const f=q('#nf').value.trim(),n=q('#nn').value.trim();if(!f||!n||!ph.length)return toast('Ism, familya va kamida 1 rasm kerak');
const b=q('#ok');b.disabled=true;b.textContent='Yuz o‘rganilmoqda…';stop();const ds=[];
if(await loadM()){for(const p of ph){try{const d=await desc(await limg(p));if(d)ds.push(d)}catch(e){}}toast(ds.length+'/'+ph.length+' rasmda yuz topildi')}else toast('Face ID yuklanmadi — yuz keyinroq o‘rganiladi');
const av=await limg(ph[0]);const nt={id:'t'+Date.now(),f,n,p:url(av,240,.8),ds};S.teachers.push(nt);save();mk('t:'+nt.id);m.remove();render()}}
/* ---- Skaner ---- */
async function scan(mode){const T=S.teachers;if(!T.length)return toast('Avval ustoz qo‘shing');date=iso(new Date());
const m=modal(`<h3 style="margin:0 0 10px">${mode==='in'?'Kelishni':'Ketishni'} skanerlash</h3><div class="vb"><video id="v" playsinline muted autoplay></video><canvas id="cn"></canvas></div>
<div class="row" style="margin:10px 0"><button class="btn g s" id="fl">${I('flip',16)} Kamera</button></div><div id="sm" class="mut">Modellar yuklanmoqda…</div><div id="rl" style="margin:8px 0"></div><button class="btn g w" id="x">Yopish</button>`);
const q=s=>m.querySelector(s);let run=true,stream=null,face='user';const hits={},seen=[];
const stop=()=>{run=false;stream&&stream.getTracks().forEach(t=>t.stop())};q('#x').onclick=()=>{stop();m.remove();render()};const say=t=>q('#sm').innerHTML=t;
if(!await loadM()){say(`<b style="color:var(--no)">Face ID modellari yuklanmadi.</b> Sahifa internetga ulangan va https hostingda ochilgan bo‘lishi kerak. Hozircha vaqtni qo‘lda kiriting (qalam tugmasi).`);return}
say('Yuzlar tayyorlanmoqda…');
for(const t of T){if(!t.ds.length&&t.p){try{const d=await desc(await limg(t.p));if(d){t.ds.push(d);mk('t:'+t.id)}}catch(e){}}}save();
const ok=T.filter(t=>t.ds.length);if(!ok.length){say('Hech bir ustozning yuzi o‘rganilmagan. Aniq rasm bilan qayta qo‘shing.');return}
const fm=new faceapi.FaceMatcher(ok.map(t=>new faceapi.LabeledFaceDescriptors(t.id,t.ds.map(d=>new Float32Array(d)))),0.55);
const v=q('#v'),cn=q('#cn'),cx=cn.getContext('2d');
async function cam(){stream&&stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face,width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=stream;await v.play();return true}catch(e){say('<b style="color:var(--no)">Kameraga ruxsat berilmadi.</b>');return false}}
q('#fl').onclick=async()=>{face=face==='user'?'environment':'user';await cam()};
if(!await cam())return;say('Kameraga qarang — yuz avtomatik taniladi.');
const rl=()=>q('#rl').innerHTML=seen.map(s=>`<div class="tr s-ok" style="margin:4px 0;padding:8px">${avh(s.t,38)}<div class="nm">${esc(s.t.f)} ${esc(s.t.n)}<div class="ln"><span class="bd ${s.k}">${s.tx}</span><span class="tm">${s.time}</span></div></div></div>`).join('');
while(run){try{if(v.videoWidth){cn.width=v.videoWidth;cn.height=v.videoHeight;cx.clearRect(0,0,cn.width,cn.height);
const rs=await faceapi.detectAllFaces(v,DO()).withFaceLandmarks(true).withFaceDescriptors();
for(const x of rs){const bx=x.detection.box,b=fm.findBestMatch(x.descriptor),good=b.label!=='unknown',t=good&&T.find(z=>z.id===b.label);
cx.lineWidth=4;cx.strokeStyle=good?'#10b981':'#ef4444';cx.strokeRect(bx.x,bx.y,bx.width,bx.height);cx.font='bold 26px system-ui';cx.fillStyle=good?'#10b981':'#ef4444';cx.fillText(good?t.f+' '+t.n:'Noma’lum',bx.x,Math.max(26,bx.y-8));
if(good){hits[b.label]=(hits[b.label]||0)+1;const d=iso(new Date()),r=R(d,b.label);
if(hits[b.label]>=2&&!seen.find(s=>s.t.id===t.id)){
if(mode==='in'){if(!r.in){r.in=nowT();save();mk('r:'+d+':'+t.id);ntf(t.id,d,'in');const a=calc(t.id,d).a;seen.unshift({t,k:a.k,tx:a.t,time:r.in});toast((a.t)+': '+t.f+' '+t.n+' · '+r.in)}else{seen.unshift({t,k:'done',tx:'Allaqachon kelgan',time:r.in});toast(t.f+' bugun allaqachon kelgan ('+r.in+')')}}
else{if(!r.out){r.out=nowT();save();mk('r:'+d+':'+t.id);ntf(t.id,d,'out');const o=calc(t.id,d).o;seen.unshift({t,k:o.k,tx:o.t,time:r.out});toast(o.t+': '+t.f+' '+t.n+' · '+r.out)}else{seen.unshift({t,k:'done',tx:'Allaqachon ketgan',time:r.out})}}
rl()}}}}}catch(e){}
await sleep(200)}}
if(CLOUD&&!tokA)auth=false;
if(auth)loadM();
render();
if(CLOUD&&auth)cloudBoot();
</script></body></html>
